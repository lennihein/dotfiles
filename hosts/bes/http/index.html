<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bes.lennihein.com</title>
  <link rel="icon" type="image/png" href="/bes.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --surface: #10141d;
      --surface-hover: #151b27;
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #f3f4f6;
      --text-muted: #8b949e;
      --text-dim: #484f58;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Minimal Header */
    header {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bes-avatar-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px;
      overflow: hidden;
    }

    .bes-avatar {
      height: 100%;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    }

    .title-group h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .title-group p {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Clean Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .icon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .card:hover .icon {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.75;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .arrow {
      width: 13px;
      height: 13px;
      color: var(--text-dim);
      opacity: 0;
      transform: translateX(-3px);
      transition: all 0.15s ease;
    }

    .card:hover .arrow {
      opacity: 1;
      transform: translateX(0);
      color: var(--text-muted);
    }

    /* Minimal Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--text);
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
