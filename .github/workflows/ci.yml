name: "CI: Build & Cache"

"on":
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      use-artifact-lock:
        description: "Whether to use updated flake.lock from workflow artifact"
        type: boolean
        default: false

jobs:
  build-hosts:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - khonsu
          - ptah
          - anubis
          - bes
          - seth
          - sobek
          - wsl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated flake.lock
        if: inputs.use-artifact-lock == true
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: lennihein
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build NixOS host toplevel
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
            --extra-experimental-features "nix-command flakes" \
            --impure \
            --show-trace
