name: "Update flake.lock & Cache (Weekly)"

"on":
  schedule:
    # Every Monday at 02:00 UTC (04:00 CEST / 03:00 CET)
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  check-update:
    name: Check for flake updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Update flake.lock
        run: |
          nix flake update --extra-experimental-features "nix-command flakes"

      - name: Check if flake.lock changed
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "No updates available."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates found!"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated flake.lock
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  build-and-cache:
    name: Build & Cache Hosts
    needs: check-update
    if: needs.check-update.outputs.has_updates == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      use-artifact-lock: true
    secrets: inherit

  push-update:
    name: Commit and push flake.lock to main
    needs: [check-update, build-and-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download updated flake.lock
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(deps): update flake.lock [weekly]"
          git push origin main
